# Grafana dashboard provisioning
apiVersion: 1

providers:
  - name: 'AI Workstation Dashboards'
    orgId: 1
    folder: 'AI Workstation'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: true
