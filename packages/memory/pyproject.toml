[project]
name = "memory"
version = "0.1.0"
description = "AI Workstation memory package"
requires-python = ">=3.11"
dependencies = [
    "contracts",
    "qdrant-client>=1.7.0",
]

[tool.uv.sources]
contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memory"]
