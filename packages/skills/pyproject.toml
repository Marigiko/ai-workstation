[project]
name = "skills"
version = "0.1.0"
description = "AI Workstation skills package"
requires-python = ">=3.11"
dependencies = [
    "contracts",
    "providers",
    "mcp",
]

[tool.uv.sources]
contracts = { workspace = true }
providers = { workspace = true }
mcp = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skills"]
