[project]
name = "routing"
version = "0.1.0"
description = "AI Workstation routing package"
requires-python = ">=3.11"
dependencies = [
    "contracts",
    "httpx>=0.27.0",
]

[tool.uv.sources]
contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/routing"]
