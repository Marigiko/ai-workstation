[project]
name = "mcp"
version = "0.1.0"
description = "AI Workstation mcp package"
requires-python = ">=3.11"
dependencies = ["contracts"]

[tool.uv.sources]
contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp"]
