[project]
name = "evaluation"
version = "0.1.0"
description = "AI Workstation evaluation package"
requires-python = ">=3.11"
dependencies = ["contracts"]

[tool.uv.sources]
contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evaluation"]
