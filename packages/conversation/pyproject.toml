[project]
name = "conversation"
version = "0.1.0"
description = "AI Workstation conversation package"
requires-python = ">=3.11"
dependencies = [
    "contracts",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
]

[tool.uv.sources]
contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/conversation"]
