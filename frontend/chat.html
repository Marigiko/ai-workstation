<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1a1a2e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>AI Chat</title>
    <link rel="manifest" href="manifest.json">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            background: #16213e;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #0f3460;
        }
        .header h1 { font-size: 16px; font-weight: 600; }
        .model-select {
            background: #0f3460;
            color: #eee;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 12px;
        }
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 12px;
            line-height: 1.5;
            font-size: 14px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .message.user {
            align-self: flex-end;
            background: #0f3460;
        }
        .message.assistant {
            align-self: flex-start;
            background: #16213e;
            border: 1px solid #0f3460;
        }
        .message.error {
            align-self: center;
            background: #d32f2f;
            font-size: 12px;
        }
        .input-area {
            background: #16213e;
            padding: 12px;
            display: flex;
            gap: 8px;
            border-top: 1px solid #0f3460;
        }
        .input-area textarea {
            flex: 1;
            background: #1a1a2e;
            border: 1px solid #0f3460;
            color: #eee;
            padding: 10px 14px;
            border-radius: 20px;
            font-size: 14px;
            resize: none;
            max-height: 100px;
            font-family: inherit;
        }
        .input-area textarea:focus {
            outline: none;
            border-color: #e94560;
        }
        .input-area button {
            background: #e94560;
            color: white;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .input-area button:disabled {
            background: #555;
            cursor: not-allowed;
        }
        .settings-btn {
            background: none;
            border: none;
            color: #eee;
            font-size: 20px;
            cursor: pointer;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: #16213e;
            padding: 20px;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
        }
        .modal-content h3 { margin-bottom: 16px; }
        .modal-content label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            color: #aaa;
        }
        .modal-content input, .modal-content select {
            width: 100%;
            padding: 10px;
            margin-bottom: 14px;
            background: #1a1a2e;
            border: 1px solid #0f3460;
            color: #eee;
            border-radius: 8px;
            font-size: 14px;
        }
        .modal-content button {
            width: 100%;
            padding: 12px;
            background: #e94560;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }
        .typing { display: flex; gap: 4px; padding: 4px 0; }
        .typing span {
            width: 8px;
            height: 8px;
            background: #888;
            border-radius: 50%;
            animation: bounce 1.4s infinite;
        }
        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-6px); }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>AI Chat</h1>
        <div style="display:flex;gap:8px;align-items:center;">
            <select class="model-select" id="modelSelect">
                <option value="gemini/gemini-2.5-flash">Gemini Flash</option>
                <option value="claude-sonnet-4-20250514">Claude Sonnet</option>
                <option value="gpt-4o">GPT-4o</option>
            </select>
            <button class="settings-btn" onclick="toggleSettings()">⚙️</button>
        </div>
    </div>

    <div class="messages" id="messages"></div>

    <div class="input-area">
        <textarea id="input" placeholder="Escribe un mensaje..." rows="1" onkeydown="handleKey(event)"></textarea>
        <button onclick="sendMessage()" id="sendBtn">➤</button>
    </div>

    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <h3>Configuración</h3>
            <label>API URL</label>
            <input type="text" id="apiUrl" placeholder="http://localhost:8000/v1">
            <label>API Key (opcional)</label>
            <input type="text" id="apiKey" placeholder="Dejar vacío si no requiere">
            <button onclick="saveSettings()">Guardar</button>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'ai-chat-config';
        let config = loadConfig();

        function loadConfig() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) return JSON.parse(saved);
            return {
                apiUrl: 'http://localhost:8000/v1',
                apiKey: ''
            };
        }

        function saveConfig() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(config));
        }

        function toggleSettings() {
            const modal = document.getElementById('settingsModal');
            document.getElementById('apiUrl').value = config.apiUrl;
            document.getElementById('apiKey').value = config.apiKey;
            modal.classList.toggle('active');
        }

        function saveSettings() {
            config.apiUrl = document.getElementById('apiUrl').value || 'http://localhost:8000/v1';
            config.apiKey = document.getElementById('apiKey').value;
            saveConfig();
            toggleSettings();
        }

        function handleKey(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        function addMessage(role, content) {
            const div = document.createElement('div');
            div.className = `message ${role}`;
            div.textContent = content;
            document.getElementById('messages').appendChild(div);
            scrollToBottom();
        }

        function addTyping() {
            const div = document.createElement('div');
            div.className = 'message assistant';
            div.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
            div.id = 'typing';
            document.getElementById('messages').appendChild(div);
            scrollToBottom();
        }

        function removeTyping() {
            const el = document.getElementById('typing');
            if (el) el.remove();
        }

        function scrollToBottom() {
            const msgs = document.getElementById('messages');
            msgs.scrollTop = msgs.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('input');
            const text = input.value.trim();
            if (!text) return;

            addMessage('user', text);
            input.value = '';
            addTyping();

            const sendBtn = document.getElementById('sendBtn');
            sendBtn.disabled = true;

            try {
                const headers = { 'Content-Type': 'application/json' };
                if (config.apiKey) {
                    headers['Authorization'] = `Bearer ${config.apiKey}`;
                }

                const res = await fetch(`${config.apiUrl}/chat/completions`, {
                    method: 'POST',
                    headers,
                    body: JSON.stringify({
                        model: document.getElementById('modelSelect').value,
                        messages: [{ role: 'user', content: text }],
                        stream: false
                    })
                });

                removeTyping();

                if (!res.ok) {
                    addMessage('error', `Error ${res.status}: ${res.statusText}`);
                    return;
                }

                const data = await res.json();
                const reply = data.choices?.[0]?.message?.content || 'Sin respuesta';
                addMessage('assistant', reply);
            } catch (err) {
                removeTyping();
                addMessage('error', `Error de conexión: ${err.message}`);
            } finally {
                sendBtn.disabled = false;
            }
        }

        // Auto-resize textarea
        document.getElementById('input').addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 100) + 'px';
        });
    </script>
</body>
</html>
