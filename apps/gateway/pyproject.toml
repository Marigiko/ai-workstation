[project]
name = "gateway"
version = "0.1.0"
description = "AI Gateway - FastAPI entry point"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "contracts",
    "providers",
    "conversation",
]

[tool.uv.sources]
contracts = { workspace = true }
providers = { workspace = true }
conversation = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway"]
