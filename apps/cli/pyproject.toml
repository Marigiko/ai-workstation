[project]
name = "cli"
version = "0.1.0"
description = "AI Workstation CLI"
requires-python = ">=3.11"
dependencies = [
    "contracts",
    "typer>=0.9.0",
    "httpx>=0.25.0",
    "rich>=13.0.0",
]

[project.scripts]
ai = "cli.main:app"

[tool.uv.sources]
contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cli"]
